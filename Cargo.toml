[package]
name = "bindermap"
version = "0.1.0"
edition = "2021"
description = "Reverse-trace AIDL/binder interface methods to the public SDK methods that reach them, from DEX bytecode."
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
zip = "2"

[profile.release]
lto = "thin"
codegen-units = 1
